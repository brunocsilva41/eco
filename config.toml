# Configuração do Jarvis. Tudo é opcional: o que não estiver aqui usa o padrão de src/jarvis/config.py.
# NUNCA coloque senhas, PINs ou tokens neste arquivo.

# log_level = "INFO"            # DEBUG | INFO | WARNING | ERROR

[audio]
# input_device = "Fuxi"         # parte do nome do microfone (ou índice). Vazio = padrão do Windows
# output_device = "Fuxi"
# vad_threshold = 0.5           # 0.05..0.95: maior = exige voz mais clara
# end_silence_ms = 700          # silêncio que encerra a frase

[stt]
# model_name = "base"           # tiny (~0,5 s) | base (~1,3 s) | small (~3 s, mais preciso). Medido em CPU.
# model_dir = 'F:\Jarvis\models\whisper\hf_small'   # use a pasta do modelo escolhido
# beam_size = 5

[llm]
# autostart = true              # o Jarvis sobe o llama-server sozinho (só em 127.0.0.1)
# ctx = 4096
# reasoning_off = false         # true para Qwen3.5 / Gemma 4 (modelos que "pensam")

[safety]
# emergency_hotkey = "ctrl+alt+f12"   # para tudo: ações, fala, mouse e teclado
# talk_key = "f9"                     # segure para falar
# mute_hotkey = "ctrl+alt+m"
# confirm_timeout_s = 15.0            # sem resposta = NÃO

# Lista de aplicativos que podem ser abertos por voz (nome falado = executável).
# ATENÇÃO: se descomentar, a lista abaixo SUBSTITUI a padrão (bloco de notas, calculadora, explorador, paint, configurações),
# então repita os que quiser manter.
# [apps.launch]
# "bloco de notas" = "notepad.exe"
# "chrome" = "chrome.exe"
