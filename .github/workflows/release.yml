name: Release

# Publica uma release SOMENTE se todas as etapas abaixo passarem, cada uma em um job separado (falha isolada, relatorio proprio).
# Disparo: tag vX.Y.Z (pushed). "Executar workflow" manual = ENSAIO: roda tudo e NAO publica.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ------------------------------------------------------------------ 1. versao: tag x installer/VERSION x CHANGELOG
  versao:
    name: "1 · Versão (tag × VERSION × CHANGELOG)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.t.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.t.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: t
        name: Definir a tag e se vai publicar
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(tr -d '[:space:]' < installer/VERSION)" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Execução manual = ENSAIO: todas as etapas rodam, mas nada é publicado."
          fi
      - name: A tag aponta para um commit da master
        if: steps.t.outputs.publish == 'true'
        run: |
          git fetch origin master --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::O commit da tag não está na master. Faça o merge/push na master antes de marcar a release."
            exit 1
          fi
      - id: v
        name: Validar tag × installer/VERSION × CHANGELOG
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: python3 -I tools/ci/check_version.py --tag "$TAG" --notes release-notes.md --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  # ------------------------------------------------------------------ 2. lint
  lint:
    name: "2 · Lint (compileall, PowerShell, workflows)"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: compileall -W error (src, tools, tests)
        run: python -W error -m compileall -q src tools tests
      - name: Sintaxe dos scripts PowerShell
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -File -Include *.ps1 -Exclude *.fast.ps1 | Where-Object { $_.FullName -notmatch '\\(venv|node_modules|\.git)\\' } | ForEach-Object {
            $errs = $null; $tok = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tok, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
            else { Write-Host "ok $($_.Name)" }
          }
          if ($bad) { exit 1 }
      - name: actionlint (workflows)
        shell: pwsh
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9"
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "actionlint.zip"
          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v$env:ACTIONLINT_VERSION/actionlint_${env:ACTIONLINT_VERSION}_windows_amd64.zip" -OutFile $zip -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $env:ACTIONLINT_SHA256) { throw "SHA-256 do actionlint não confere" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "actionlint") -Force
          & (Join-Path $env:RUNNER_TEMP "actionlint\actionlint.exe") -color
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # ------------------------------------------------------------------ 3. testes unitarios
  testes-unitarios:
    name: "3 · Testes unitários"
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: installer/requirements.lock.txt
      - name: Dependências travadas por hash
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r installer/requirements.lock.txt"
      - name: Suites (tests/*.py sem GPU, microfone ou login)
        run: python -I tools/ci/run_tests.py --group unit --out work/ci_tests
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-testes-unitarios
          path: work/ci_tests
          retention-days: 7

  # ------------------------------------------------------------------ 4. testes de UI (offscreen)
  testes-ui:
    name: "4 · Testes de interface (offscreen)"
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: installer/requirements.lock.txt
      - name: Dependências travadas por hash
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r installer/requirements.lock.txt"
      - name: Suites de UI (100% escuro e 150% claro)
        run: python -I tools/ci/run_tests.py --group ui --out work/ci_tests
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-testes-ui
          path: work/ci_tests
          retention-days: 7

  # ------------------------------------------------------------------ 5. schema
  schema:
    name: "5 · Schema de configuração"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: installer/requirements.lock.txt
      - run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r installer/requirements.lock.txt"
      - name: schema.uncovered_fields() vazio
        run: python -I tools/ci/schema_check.py

  # ------------------------------------------------------------------ 6. privacidade
  privacidade:
    name: "6 · Segredos e e-mails pessoais"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Varredura (arquivos + todo o histórico + autores dos commits)
        run: python3 -I tools/ci/scan_repo.py --history

  # ------------------------------------------------------------------ 7. licencas e wheels
  licencas-wheels:
    name: "7 · Licenças e wheels travadas"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: installer/requirements.lock.txt
      - name: Lock coerente com o .in (todas as linhas com hash)
        run: python -I tools/ci/check_lock.py
      - name: Instalar com --require-hashes e gerar THIRD-PARTY.txt
        shell: pwsh
        run: |
          $site = Join-Path $env:RUNNER_TEMP "site"
          python -m pip install --require-hashes --only-binary=:all: --no-deps --target $site -r installer/requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install --require-hashes falhou" }
          python -I installer/make_notices.py $site (Join-Path $env:RUNNER_TEMP "THIRD-PARTY.txt")
          if ($LASTEXITCODE -ne 0) { throw "make_notices falhou" }
          $t = Get-Content (Join-Path $env:RUNNER_TEMP "THIRD-PARTY.txt") -Raw
          $n = ($t -split "`n" | Where-Object { $_ -match '^\S+ \S+  -  ' }).Count
          if ($n -lt 30) { throw "THIRD-PARTY.txt com poucos pacotes ($n)" }
          $unknown = ($t -split "`n" | Where-Object { $_ -match 'ver metadados do pacote' }).Count
          "### Licenças`n- $n pacotes listados; $unknown sem licença nos metadados (revisar)" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Licença do projeto presente
        shell: pwsh
        run: |
          foreach ($f in "installer/LICENSE.pt-BR.txt", "installer/LICENSE.en.txt") { if (-not (Test-Path $f)) { throw "falta $f" } }

  # ------------------------------------------------------------------ 8. build do instalador
  build:
    name: "8 · Build do instalador"
    needs: [versao, lint, testes-unitarios, testes-ui, schema, privacidade, licencas-wheels]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: venv mínimo (o build.ps1 usa venv\Scripts\python.exe para baixar as wheels)
        run: python -m venv venv
      - name: Binários do whisper.cpp (pacote fixado por SHA-256)
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./tools/ci/fetch_deps.ps1
      - name: Cache de downloads do build (llama.cpp, Python embutido, wheels)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            installer/cache
            installer/wheels
          key: build-${{ runner.os }}-${{ hashFiles('installer/manifest.json', 'installer/requirements.lock.txt') }}
      - name: Build (Inno Setup, lzma2/max)
        shell: pwsh
        run: ./installer/build.ps1 -NoWait
      - name: Montar os assets (hash conferido, alias estável)
        shell: pwsh
        env:
          VERSION: ${{ needs.versao.outputs.version }}
        run: ./tools/ci/make_release_assets.ps1 -Dist installer/dist -Version $env:VERSION -Out release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------ 9. teste-fumaca em runner limpo
  fumaca:
    name: "9 · Teste-fumaça do instalador"
    needs: [versao, build]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Instalar em pasta temporária, rodar tools/config/doctor e desinstalar
        shell: pwsh
        env:
          VERSION: ${{ needs.versao.outputs.version }}
        run: ./tools/ci/smoke_installer.ps1 -Installer "release-assets/Eco-Setup-$env:VERSION.exe" -Version $env:VERSION

  # ------------------------------------------------------------------ 10. publicar (so se TUDO passou)
  publicar:
    name: "10 · Publicar a release"
    needs: [versao, lint, testes-unitarios, testes-ui, schema, privacidade, licencas-wheels, build, fumaca]
    if: needs.versao.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    steps:
      - name: Confirmar que TODAS as etapas anteriores passaram
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          print({k: v["result"] for k, v in needs.items()})
          if bad:
              print("::error::etapas sem sucesso:", bad)
              sys.exit(1)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Reconferir os hashes antes de publicar
        env:
          VERSION: ${{ needs.versao.outputs.version }}
        run: |
          cd release-assets
          sha256sum -c "Eco-Setup-${VERSION}.exe.sha256"
          sha256sum -c "Eco-Setup.exe.sha256"
          test "$(sha256sum "Eco-Setup-${VERSION}.exe" | cut -d' ' -f1)" = "$(sha256sum Eco-Setup.exe | cut -d' ' -f1)"
      - name: Atestado de procedência (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/Eco-Setup-*.exe
      - name: Corpo da release (notas do CHANGELOG + como verificar)
        env:
          VERSION: ${{ needs.versao.outputs.version }}
        run: |
          HASH="$(cut -d' ' -f1 "release-assets/Eco-Setup-${VERSION}.exe.sha256")"
          SIZE="$(stat -c %s "release-assets/Eco-Setup-${VERSION}.exe")"
          {
            cat notes/release-notes.md
            echo
            echo "## Download e verificação"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Instalador | \`Eco-Setup-${VERSION}.exe\` (\`Eco-Setup.exe\` é o mesmo arquivo, com nome estável) |"
            echo "| Tamanho | ${SIZE} bytes |"
            echo "| SHA-256 | \`${HASH}\` |"
            echo
            echo "Verifique no PowerShell: \`(Get-FileHash .\\Eco-Setup-${VERSION}.exe -Algorithm SHA256).Hash\` deve ser igual ao SHA-256 acima."
            echo "O arquivo também tem atestado de procedência: \`gh attestation verify Eco-Setup-${VERSION}.exe --repo ${GITHUB_REPOSITORY}\`."
            echo
            echo "Requisitos: Windows 10 (build 19044) ou 11, 64 bits, 12 GB de RAM ou mais, GPU com Vulkan para velocidade. O instalador não é assinado com certificado de código: o SmartScreen pode avisar \"editor desconhecido\" (confira o SHA-256)."
          } > release-body.md
      - name: Criar a release (rascunho, subir os arquivos, só então publicar)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.versao.outputs.tag }}
          VERSION: ${{ needs.versao.outputs.version }}
          PRERELEASE: ${{ needs.versao.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; else flags="--latest"; fi
          # rascunho primeiro: os arquivos sobem antes de a release ficar visível (o site não pode apontar para um asset ausente)
          gh release create "$TAG" --draft --verify-tag --title "Eco ${VERSION}" --notes-file release-body.md $flags \
            "release-assets/Eco-Setup-${VERSION}.exe" \
            "release-assets/Eco-Setup-${VERSION}.exe.sha256" \
            "release-assets/Eco-Setup.exe" \
            "release-assets/Eco-Setup.exe.sha256"
          gh release edit "$TAG" --draft=false
      - name: Atualizar o site (releases.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
